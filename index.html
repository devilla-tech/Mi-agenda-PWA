<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Balance Semanal">
  <link rel="manifest" href="manifest.json">
  <title>Balance Semanal | Gestor de Deudas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="wallet-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
          </svg>
        </div>
        <div>
          <h1>Balance Semanal</h1>
          <p>Controla tus deudas y ahorro</p>
        </div>
      </div>
      <div class="trend-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
          <polyline points="16 7 22 7 22 13"/>
        </svg>
      </div>
    </header>

    <!-- TARJETA PRINCIPAL DEGRADADA (LO QUE TE QUEDA LIBRE) -->
    <section class="hero-card" id="heroCard">
      <div class="hero-content">
        <span class="hero-label">Te puedes quedar libre</span>
        <div class="hero-amount" id="resFree">$0.00</div>
        <div class="hero-status">
          <span class="status-pill" id="statusPill">✓</span>
          <span id="resAdvice">Ingresa tu ganancia y deudas</span>
        </div>
      </div>
      <div class="hero-bars" aria-hidden="true">
        <span style="height: 28%"></span>
        <span style="height: 45%"></span>
        <span style="height: 62%"></span>
        <span style="height: 80%"></span>
        <span style="height: 100%"></span>
      </div>
    </section>

    <!-- TARJETA DIVIDIDA (APARTAR DEUDAS VS INGRESO SEMANAL) -->
    <section class="split-card">
      <div class="split-col">
        <div class="split-head">
          <svg class="icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          <span>Apartar deudas</span>
        </div>
        <div class="split-val" id="resWeeklyDebt">$0.00</div>
        <small class="split-sub" id="resTotalDebt">Deuda total: $0.00</small>
      </div>

      <div class="split-divider"></div>

      <div class="split-col">
        <div class="split-head">
          <svg class="icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Ganancia semanal</span>
        </div>
        <div class="split-val" id="resIncome">$0.00</div>
        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill" id="debtProgress" style="width: 0%"></div>
          </div>
          <span class="progress-pct" id="debtPct">0%</span>
        </div>
      </div>
    </section>

    <!-- BOTONES DE ACCIÓN RÁPIDA -->
    <section class="actions-grid">
      <button type="button" class="action-btn" id="btnOpenDebt">
        <span class="act-circle purple">+</span>
        <span>Agregar<br>Deuda</span>
      </button>
      <button type="button" class="action-btn" id="btnOpenIncome">
        <span class="act-circle blue">$</span>
        <span>Ingresar<br>Ganancia</span>
      </button>
      <button type="button" class="action-btn" id="btnPayWeek">
        <span class="act-circle green">✓</span>
        <span>Abonar<br>Semana</span>
      </button>
      <button type="button" class="action-btn" id="btnResetWeek">
        <span class="act-circle pink">↺</span>
        <span>Nueva<br>Semana</span>
      </button>
    </section>

    <!-- FORMULARIO DESPLEGABLE INGRESO -->
    <section class="drawer-card" id="incomeDrawer" hidden>
      <div class="drawer-head">
        <h3>¿Cuánto ganaste esta semana?</h3>
        <button type="button" class="close-drawer" data-close="incomeDrawer">×</button>
      </div>
      <div class="input-group">
        <input type="number" id="weeklyIncome" inputmode="decimal" placeholder="Ej. 3500" min="0" step="50">
        <button type="button" class="btn-primary" id="saveIncomeBtn">Guardar</button>
      </div>
    </section>

    <!-- FORMULARIO DESPLEGABLE DEUDA -->
    <section class="drawer-card" id="debtDrawer" hidden>
      <div class="drawer-head">
        <h3>Nueva deuda o pago fijo</h3>
        <button type="button" class="close-drawer" data-close="debtDrawer">×</button>
      </div>
      <form id="debtForm" class="debt-form">
        <input type="text" id="debtName" placeholder="Nombre (Ej. Coppel, Internet, Gasolina)" required>
        <div class="form-row">
          <input type="number" id="debtTotal" inputmode="decimal" placeholder="Total ($)" min="1" step="10" required>
          <input type="number" id="debtWeeks" inputmode="numeric" placeholder="Semanas" min="1" max="104" value="1" required>
        </div>
        <button type="submit" class="btn-primary">Agregar a mis deudas</button>
      </form>
    </section>

    <!-- LISTA DE DEUDAS / MOVIMIENTOS -->
    <section class="list-section">
      <div class="list-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          Mis Deudas Activas
        </h2>
        <span class="list-count" id="debtCount">0 activas</span>
      </div>

      <ul id="debtList" class="debt-list"></ul>
    </section>
  </main>

  <!-- BARRA INFERIOR ESTILO iOS -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item active" id="navHome">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/></svg>
      <span>Inicio</span>
    </button>
    <button type="button" class="nav-item" id="navIncome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Ingreso</span>
    </button>
    <button type="button" class="nav-item" id="navDebt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Deuda</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
